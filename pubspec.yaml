name: novachat
description: "NovaChat - Premium Real-time Chat Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # State Management
  provider: ^6.1.2

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.2
  country_code_picker: ^3.0.0
  pinput: ^5.0.0
  emoji_picker_flutter: ^4.4.0
  flutter_svg: ^2.0.10+1

  # Audio
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.1

  # Utils
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  timeago: ^3.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
